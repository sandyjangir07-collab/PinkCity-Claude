<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PinkCity — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,30&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>

:root{--bg:oklch(0.975 0.012 82);--card:oklch(0.995 0.003 90);--primary:oklch(0.50 0.18 8);--primary-fg:oklch(0.99 0 0);--primary-soft:oklch(0.93 0.05 8);--border:oklch(0.905 0.012 70);--muted-fg:oklch(0.52 0.012 30);--fg:oklch(0.20 0.014 30);--secondary:oklch(0.945 0.016 78);--ink:oklch(0.18 0.012 30);--shadow-soft:0 1px 2px rgba(20,16,18,0.025),0 4px 14px -6px rgba(20,16,18,0.06);--shadow-elev:0 1px 2px rgba(20,16,18,0.03),0 18px 50px -20px rgba(157,29,76,0.22);--shadow-card:0 1px 2px rgba(20,16,18,0.03),0 10px 30px -14px rgba(20,16,18,0.10);--font-display:"Fraunces",ui-serif,Georgia,serif;--font-sans:"Inter",ui-sans-serif,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-sans);background:var(--bg);color:var(--fg);min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-0.02em}
.glass-strong{background:color-mix(in oklab,white 78%,transparent);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);border:1px solid color-mix(in oklab,white 65%,transparent)}
.topnav{position:sticky;top:0;z-index:100;padding:12px 16px}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;background:color-mix(in oklab,white 78%,transparent);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);border:1px solid color-mix(in oklab,white 65%,transparent);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow-soft)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#9d1d4c);display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 3px 10px rgba(157,29,76,0.35);overflow:hidden;flex-shrink:0}
.nav-logo img{width:100%;height:100%;object-fit:contain}
.nav-brand-name{font-family:var(--font-display);font-size:18px;color:var(--fg)}
.nav-brand-name em{color:var(--primary);font-style:normal}
.nav-actions{display:flex;align-items:center;gap:10px}
.nav-tag{display:none;align-items:center;gap:5px;background:var(--primary-soft);border:1px solid rgba(157,29,76,0.2);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--primary)}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--primary);overflow:hidden;flex-shrink:0}
.nav-uname{font-size:13px;font-weight:500;color:var(--fg);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
@media(min-width:640px){.nav-uname{display:block}.nav-tag{display:inline-flex}}
.nav-signout{background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--muted-fg);cursor:pointer;padding:0;transition:color 0.18s}
.nav-signout:hover{color:var(--primary)}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--primary-fg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;border:none;cursor:pointer;text-decoration:none;box-shadow:0 2px 10px -2px rgba(157,29,76,0.35);transition:all 0.3s}
.btn-primary:hover{background:#9d1d4c;box-shadow:0 8px 24px -6px rgba(157,29,76,0.55);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.7);border:1px solid var(--border);color:var(--fg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:all 0.2s}
.btn-ghost:hover{background:white;border-color:rgba(157,29,76,0.3)}
.btn-approve{background:rgba(74,222,128,0.12);color:#166534;border:1px solid rgba(74,222,128,0.3);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s}
.btn-approve:hover{background:rgba(74,222,128,0.22)}
.btn-reject{background:rgba(248,113,113,0.10);color:#dc2626;border:1px solid rgba(248,113,113,0.25);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s}
.btn-reject:hover{background:rgba(248,113,113,0.20)}
.btn-edit{background:var(--primary-soft);color:var(--primary);border:1px solid rgba(157,29,76,0.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s}
.btn-edit:hover{background:color-mix(in oklab,var(--primary) 15%,white)}
.btn-del{background:transparent;color:var(--muted-fg);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:400;cursor:pointer;transition:all 0.18s}
.btn-del:hover{color:#dc2626;border-color:rgba(220,38,38,0.25)}
.fl{display:block;font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-fg);margin-bottom:7px}
.fi,.fsel{width:100%;background:var(--secondary);border:1px solid transparent;border-radius:14px;padding:13px 16px;font-family:var(--font-sans);font-size:14px;color:var(--fg);outline:none;transition:all 0.18s;appearance:none;-webkit-appearance:none}
.fi:focus,.fsel:focus{background:white;border-color:rgba(157,29,76,0.3);box-shadow:0 0 0 3px rgba(157,29,76,0.08)}
.fi::placeholder{color:var(--muted-fg)}
.ftextarea{width:100%;background:var(--secondary);border:1px solid transparent;border-radius:14px;padding:13px 16px;font-family:var(--font-sans);font-size:14px;color:var(--fg);outline:none;transition:all 0.18s;resize:vertical;min-height:90px}
.ftextarea:focus{background:white;border-color:rgba(157,29,76,0.3);box-shadow:0 0 0 3px rgba(157,29,76,0.08)}
.btn-submit{width:100%;background:var(--primary);color:white;border:none;border-radius:999px;padding:16px;font-family:var(--font-sans);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.3s;box-shadow:0 2px 10px -2px rgba(157,29,76,0.35)}
.btn-submit:hover{background:#9d1d4c;box-shadow:0 8px 24px -6px rgba(157,29,76,0.55)}
.btn-submit:disabled{opacity:0.6;cursor:default}
.toast{display:none;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:999px;padding:12px 24px;font-size:13px;z-index:400;white-space:nowrap;box-shadow:0 4px 20px rgba(20,16,18,0.25)}
.toast.on{display:block;animation:toast-in 0.3s cubic-bezier(0.22,1,0.36,1)}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(20,16,18,0.48);backdrop-filter:blur(8px);z-index:300;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--bg);border-radius:28px 28px 0 0;padding:8px 28px 48px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:modal-in 0.32s cubic-bezier(0.22,1,0.36,1)}
@keyframes modal-in{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){.modal{border-radius:28px;margin:auto;margin-bottom:40px}}
.modal-handle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:16px auto 28px}
.modal-title{font-family:var(--font-display);font-size:28px;color:var(--fg);margin-bottom:24px}
.form-err{font-size:13px;color:oklch(0.52 0.18 22);min-height:16px;opacity:0;transition:opacity 0.3s;margin-bottom:12px}
.form-grid{display:flex;flex-direction:column;gap:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600}
.badge-pending{background:rgba(201,168,76,0.15);color:oklch(0.55 0.12 78)}
.badge-active{background:rgba(74,222,128,0.15);color:#166534}
.badge-rejected{background:rgba(248,113,113,0.12);color:#dc2626}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:32px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:white;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow-soft)}
.stat-n{font-family:var(--font-display);font-size:32px;color:var(--primary);letter-spacing:-0.02em;line-height:1}
.stat-l{font-size:12px;color:var(--muted-fg);margin-top:5px}
.listing-list{display:flex;flex-direction:column;gap:14px}
.listing-card{background:white;border:1px solid var(--border);border-radius:22px;overflow:hidden;display:flex;align-items:stretch;transition:all 0.3s}
.listing-card:hover{box-shadow:var(--shadow-elev);border-color:rgba(157,29,76,0.2);transform:translateY(-2px)}
.listing-thumb{width:88px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.listing-body{flex:1;padding:18px 20px 16px 0}
.listing-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.listing-title{font-family:var(--font-display);font-size:19px;color:var(--fg);line-height:1.2}
.listing-price{font-family:var(--font-display);font-size:18px;color:var(--primary);white-space:nowrap;flex-shrink:0}
.listing-meta{font-size:12px;color:var(--muted-fg);margin-bottom:8px}
.listing-desc{font-size:13px;color:var(--muted-fg);line-height:1.6;margin-bottom:12px}
.listing-actions{display:flex;gap:8px;flex-wrap:wrap}
.listing-by{font-size:11px;color:var(--muted-fg);margin-top:4px}
.main{max-width:1200px;margin:0 auto;padding:40px 20px 100px}
@media(min-width:640px){.main{padding:40px 32px 100px}}
.page-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--primary);margin-bottom:8px}
.page-title{font-family:var(--font-display);font-size:36px;color:var(--fg);letter-spacing:-0.025em;margin-bottom:8px}
.page-sub{font-size:14px;color:var(--muted-fg);margin-bottom:32px;line-height:1.6}
.empty{text-align:center;padding:60px 24px;background:white;border-radius:24px;border:1px solid var(--border);color:var(--muted-fg);font-size:15px}
.empty-icon{font-size:40px;margin-bottom:14px;opacity:0.4}
@keyframes logo-in{0%{transform:translateY(-6px) scale(0.92);opacity:0}60%{transform:translateY(2px) scale(1.02)}100%{transform:none;opacity:1}}
.logo-in{animation:logo-in 0.7s 0.05s cubic-bezier(0.22,1,0.36,1) both}
@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade-up{animation:fade-up 0.6s cubic-bezier(0.22,1,0.36,1) both}
.fade-up-1{animation-delay:0.10s}.fade-up-2{animation-delay:0.20s}.fade-up-3{animation-delay:0.30s}

body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;background-image:radial-gradient(at 20% 10%,color-mix(in oklab,var(--primary) 10%,transparent) 0px,transparent 50%),radial-gradient(at 80% 90%,oklch(0.85 0.06 78 / 0.4) 0px,transparent 55%)}
.back-link{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-fg);text-decoration:none;margin-bottom:24px;transition:color 0.2s;align-self:flex-start;max-width:420px;width:100%}
.back-link:hover{color:var(--primary)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;text-decoration:none}
.brand-logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#9d1d4c);display:flex;align-items:center;justify-content:center;padding:5px;box-shadow:0 4px 14px -4px rgba(157,29,76,0.5);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:var(--font-display);font-size:26px;color:var(--fg);letter-spacing:-0.02em}
.brand-name em{color:var(--primary);font-style:normal}
.login-card{background:color-mix(in oklab,white 78%,transparent);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);border:1px solid color-mix(in oklab,white 65%,transparent);border-radius:28px;padding:40px 36px 36px;width:100%;max-width:420px;box-shadow:var(--shadow-elev)}
.card-title{font-family:var(--font-display);font-size:34px;color:var(--fg);letter-spacing:-0.025em;margin-bottom:6px}
.card-sub{font-size:14px;color:var(--muted-fg);line-height:1.65;margin-bottom:28px}
.err{font-size:13px;color:oklch(0.52 0.18 22);min-height:18px;margin-bottom:14px;opacity:0;transition:opacity 0.3s;line-height:1.5}
.g-btn{width:100%;background:white;border:1.5px solid var(--border);border-radius:999px;padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-sans);font-size:15px;font-weight:500;color:var(--fg);cursor:pointer;transition:all 0.3s;box-shadow:0 1px 6px rgba(20,16,18,0.06)}
.g-btn:hover{border-color:rgba(157,29,76,0.3);box-shadow:0 4px 16px rgba(157,29,76,0.12);transform:translateY(-1px)}
.g-btn:disabled{opacity:0.6;cursor:default;transform:none}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:12px;color:var(--muted-fg);letter-spacing:0.08em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.fi{margin-bottom:16px}
.foot{text-align:center;margin-top:20px;font-size:13px;color:var(--muted-fg)}
.foot a{color:var(--primary);font-weight:500;text-decoration:none}
</style>

function setBusy(on){document.getElementById("g-btn").disabled=on;const e=document.getElementById("e-btn");e.disabled=on;e.textContent=on?"Signing in…":"Sign in";}
function showErr(msg){const el=document.getElementById("err");el.textContent=msg;el.style.opacity="1";setTimeout(()=>el.style.opacity="0",5000);}
window.googleSignIn=async()=>{setBusy(true);const redirectTo=window.location.origin+"/dashboard.html";const r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo,scopes:"email profile"}});if(r.error){showErr("Google sign-in failed: "+r.error.message);setBusy(false);}};
window.emailSignIn=async()=>{const email=document.getElementById("em").value.trim();const pass=document.getElementById("pw").value;if(!email||!pass){showErr("Enter email and password.");return;}setBusy(true);const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error){showErr("Incorrect email or password.");setBusy(false);}else window.location.href="dashboard.html";};
</script>
