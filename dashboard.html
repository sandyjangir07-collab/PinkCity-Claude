<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PinkCity — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl = window.SUPABASE_URL || "https://mfpnndrszjygespcfdbo.supabase.co";
const supabaseKey = window.SUPABASE_ANON_KEY || "sb_publishable_BN03ClNsFtgDS32FbAFckQ_vSGfFccf";
const supabase = createClient(supabaseUrl, supabaseKey, {
  auth: {
    persistSession: true,
    autoRefreshToken: true
  }
});

const storageBucket = "property-images";
let currentUser = null, isAdmin = false;
let selectedImageFile = null;
let currentImageUrl = "";

async function resolveUserRole(user) {
  const { data, error } = await supabase.from("profiles").select("role").eq("id", user.id).single();
  if (error) {
    console.error("Profile role lookup failed", error);
    return user.email?.toLowerCase() === "admin@pinkcity.com";
  }
  return data?.role === "admin" || user.email?.toLowerCase() === "admin@pinkcity.com";
}

function showPageError(msg) {
  const el = document.getElementById("page-error");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
}

function clearPageError() {
  const el = document.getElementById("page-error");
  if (!el) return;
  el.textContent = "";
  el.classList.remove("show");
}

let authResolved = false;

async function bootDashboard(user) {
  currentUser = user;
  isAdmin = await resolveUserRole(user);
  renderNav(user);
  if (isAdmin) renderAdminView(); else renderTeamView();
}

async function initializeDashboard() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      authResolved = true;
      await bootDashboard(session.user);
      return;
    }
  } catch (e) {
    console.error("Dashboard session init failed", e);
  }
  setTimeout(() => {
    if (!authResolved) {
      window.location.replace(`${window.location.origin}/login.html`);
    }
  }, 1500);
}

supabase.auth.onAuthStateChange(async (_event, session) => {
  const user = session?.user || null;
  if (!user) {
    if (authResolved) {
      window.location.replace(`${window.location.origin}/login.html`);
    }
    return;
  }
  authResolved = true;
  await bootDashboard(user);
});

initializeDashboard();

function renderNav(user) {
  const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "User";
  document.getElementById("uname").textContent = name.split(" ")[0];
  if (user.user_metadata?.avatar_url) {
    document.getElementById("uavatar").style.backgroundImage = `url(${user.user_metadata.avatar_url})`;
    document.getElementById("uavatar").style.backgroundSize = "cover";
    document.getElementById("uavatar").textContent = "";
  } else {
    document.getElementById("uavatar").textContent = name[0].toUpperCase();
  }
  if (isAdmin) {
    document.getElementById("admin-tag").style.display = "inline-flex";
    document.getElementById("page-title").textContent = "All Submissions";
    document.getElementById("page-sub").textContent = "Approve or reject property listings from your team.";
    document.getElementById("add-btn").style.display = "none";
  }
}

async function renderTeamView() {
  clearPageError();
  const { data, error } = await supabase.from("listings").select("*").eq("uid", currentUser.id).order("created_at", { ascending: false });
  const listings = (data || []).map(item => ({ id: item.id, ...item }));
  if (error) {
    console.error("Team listings load failed", error);
    showPageError("Could not load your listings. Check the Supabase listings table and RLS policies.");
    renderCards([], false);
    return;
  }
  renderCards(listings, false);
}

async function renderAdminView() {
  clearPageError();
  const { data, error } = await supabase.from("listings").select("*").order("created_at", { ascending: false });
  const listings = (data || []).map(item => ({ id: item.id, ...item }));
  if (error) {
    console.error("Admin listings load failed", error);
    showPageError("Could not load submissions. Check the Supabase listings table and RLS policies.");
    renderCards([], true);
    return;
  }
  const pending = listings.filter(l => l.status === "pending").length;
  const active = listings.filter(l => l.status === "active").length;
  document.getElementById("stat-pending").textContent = pending;
  document.getElementById("stat-active").textContent = active;
  document.getElementById("stat-total").textContent = listings.length;
  document.getElementById("admin-stats").style.display = "grid";
  renderCards(listings, true);
}

function renderCards(listings, admin) {
  const el = document.getElementById("listings");
  if (!listings.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🏠</div><p>${admin ? "No submissions yet." : "No listings yet.<br>Click <strong>+ Add listing</strong> to submit your first property."}</p></div>`;
    return;
  }
  el.innerHTML = listings.map(l => cardHTML(l, admin)).join("");
}

function cardHTML(l, admin) {
  const st = { pending: ["#f0c84a", "◐ Pending approval"], active: ["#4ade80", "● Live on site"], rejected: ["#f87171", "✕ Rejected"] }[l.status] || ["#c0b4b8", "— Unknown"];
  const grad = { plot: "linear-gradient(135deg,#c8a98a,#9a7050)", farmhouse: "linear-gradient(135deg,#5a8a6a,#2a5a3a)", apartment: "linear-gradient(135deg,#8090b0,#506080)", villa: "linear-gradient(135deg,#c4a870,#8a6a40)", land: "linear-gradient(135deg,#8aaa7a,#4a7a4a)", commercial: "linear-gradient(135deg,#6a8faf,#3a5f7f)" }[l.type] || "linear-gradient(135deg,#c8a98a,#9a7050)";
  const emoji = { plot: "🏜️", farmhouse: "🌿", apartment: "🏢", villa: "🏯", land: "🌾", commercial: "🏗️" }[l.type] || "🏠";
  const date = l.created_at ? new Date(l.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
  return `<div class="card" id="card-${l.id}">
    <div class="card-thumb" style="background:${grad}">${emoji}</div>
    <div class="card-body">
      <div class="card-top">
        <div>
          <div class="card-title">${l.title}</div>
          <div class="card-meta">${[l.size, l.area].filter(Boolean).join(" · ")}${l.verified ? " · ✓ Verified" : ""}</div>
        </div>
        <div class="card-price">${l.price}</div>
      </div>
      <div class="card-status" style="color:${st[0]};background:${st[0]}22">${st[1]}</div>
      ${admin ? `<div class="card-by">By ${l.submitter_name || "Team member"} · ${date}</div>` : `<div class="card-by">${date}</div>`}
      ${l.desc ? `<div class="card-desc">${l.desc}</div>` : ""}
      <div class="card-actions">
        ${admin && l.status === "pending" ? `<button class="btn-approve" onclick="approve('${l.id}')">✓ Approve</button><button class="btn-reject" onclick="reject('${l.id}')">✕ Reject</button>` : ""}
        ${!admin && l.status !== "active" ? `<button class="btn-edit" onclick="openEdit('${l.id}')">Edit</button>` : ""}
        ${admin ? `<button class="btn-del" onclick="del('${l.id}')">Delete</button>` : ""}
      </div>
    </div>
  </div>`;
}

window.approve = async id => {
  const { error } = await supabase.from("listings").update({ status: "active", approved_at: new Date().toISOString(), approved_by: currentUser.id }).eq("id", id);
  if (!error) pulse(id, "#4ade8022");
};
window.reject = async id => {
  const { error } = await supabase.from("listings").update({ status: "rejected", rejected_at: new Date().toISOString() }).eq("id", id);
  if (!error) pulse(id, "#f8717122");
};
window.del = async id => {
  if (!confirm("Permanently delete this listing?")) return;
  await supabase.from("listings").delete().eq("id", id);
};
function pulse(id, bg) {
  const el = document.getElementById("card-" + id);
  if (el) { el.style.background = bg; setTimeout(() => el.style.background = "", 800); }
}

let editId = null;
window.openAdd = () => {
  editId = null;
  currentImageUrl = "";
  selectedImageFile = null;
  document.getElementById("modal-title").textContent = "Add New Listing";
  document.getElementById("lform").reset();
  document.getElementById("image-preview").src = "";
  document.getElementById("image-preview").style.display = "none";
  document.getElementById("submit-btn").textContent = "Submit for approval";
  openModal();
};

document.addEventListener("DOMContentLoaded", () => {
  const addButton = document.getElementById("add-btn");
  if (addButton) {
    addButton.onclick = () => window.openAdd();
    addButton.addEventListener("click", () => window.openAdd());
  }
});

window.openEdit = async id => {
  const { data } = await supabase.from("listings").select("*").eq("id", id).single();
  if (!data) return;
  editId = id;
  currentImageUrl = data.image_url || "";
  document.getElementById("modal-title").textContent = "Edit Listing";
  document.getElementById("f-title").value = data.title || "";
  document.getElementById("f-type").value = data.type || "plot";
  document.getElementById("f-area").value = data.area || "";
  document.getElementById("f-price").value = data.price || "";
  document.getElementById("f-size").value = data.size || "";
  document.getElementById("f-desc").value = data.desc || "";
  document.getElementById("image-preview").src = currentImageUrl;
  document.getElementById("image-preview").style.display = currentImageUrl ? "block" : "none";
  selectedImageFile = null;
  document.getElementById("submit-btn").textContent = "Save changes";
  openModal();
};
window.handleListingImage = async event => {
  const file = event.target.files?.[0];
  selectedImageFile = file || null;
  const preview = document.getElementById("image-preview");
  if (!file) { preview.src = ""; preview.style.display = "none"; return; }
  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
};
async function uploadListingImage(file) {
  if (!file) return "";
  const filePath = `${currentUser.id}/${Date.now()}-${file.name.replace(/\s+/g, "-")}`;
  const { data, error } = await supabase.storage.from(storageBucket).upload(filePath, file, { cacheControl: "3600", upsert: false });
  if (error) throw error;
  const { data: publicUrlData } = supabase.storage.from(storageBucket).getPublicUrl(data.path);
  return publicUrlData.publicUrl;
}
window.submitListing = async () => {
  const title = document.getElementById("f-title").value.trim();
  const type = document.getElementById("f-type").value;
  const area = document.getElementById("f-area").value.trim();
  const price = document.getElementById("f-price").value.trim();
  const size = document.getElementById("f-size").value.trim();
  const desc = document.getElementById("f-desc").value.trim();
  if (!title || !area || !price) { showFormErr("Please fill Title, Area and Price."); return; }
  const btn = document.getElementById("submit-btn");
  btn.textContent = "Saving…"; btn.disabled = true;
  try {
    const imageUrl = selectedImageFile ? await uploadListingImage(selectedImageFile) : currentImageUrl;
    if (editId) {
      const payload = { title, type, area, price, size, desc, updated_at: new Date().toISOString() };
      if (imageUrl) payload.image_url = imageUrl;
      await supabase.from("listings").update(payload).eq("id", editId);
    } else {
      await supabase.from("listings").insert({
        title,
        type,
        area,
        price,
        size,
        desc,
        image_url: imageUrl,
        status: "pending",
        uid: currentUser.id,
        submitter_name: currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email,
        submitter_email: currentUser.email,
        verified: false,
        created_at: new Date().toISOString()
      });
    }
    closeModal();
    toast(editId ? "✓ Listing updated!" : "✓ Submitted! Awaiting admin approval.");
    if (isAdmin) renderAdminView(); else renderTeamView();
  } catch (e) {
    showFormErr("Error saving. Try again.");
  } finally {
    btn.textContent = editId ? "Save changes" : "Submit for approval";
    btn.disabled = false;
  }
};

function openModal() {
  const overlay = document.getElementById("modal-overlay");
  if (overlay) {
    overlay.classList.add("show");
    overlay.style.display = "flex";
  }
  document.body.style.overflow = "hidden";
  setTimeout(() => document.getElementById("f-title").focus(), 300);
}
function closeModal() {
  const overlay = document.getElementById("modal-overlay");
  if (overlay) {
    overlay.classList.remove("show");
    overlay.style.display = "none";
  }
  document.body.style.overflow = "";
}
window.closeModal = closeModal;
function showFormErr(msg) { const el = document.getElementById("form-err"); el.textContent = msg; el.style.opacity = "1"; setTimeout(() => el.style.opacity = "0", 3500); }

window.handleSignOut = async () => { await supabase.auth.signOut(); window.location.href = `${window.location.origin}/login.html`; };

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3200); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0ebe2;min-height:100vh;-webkit-font-smoothing:antialiased}
/* NAV */

.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand-icon{width:36px;height:36px;border-radius:50%;background:#b06080;overflow:hidden;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#2c1b22}
.brand-name em{color:#b06080;font-style:normal}
.nav-right{display:flex;align-items:center;gap:10px}
.admin-tag{display:none;align-items:center;gap:5px;background:rgba(176,96,128,0.10);border:1px solid rgba(176,96,128,0.20);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;color:#b06080;letter-spacing:0.05em}
.uavatar{width:32px;height:32px;border-radius:50%;background:#f5eaed;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#b06080;flex-shrink:0;overflow:hidden}
.uname{font-size:13px;font-weight:500;color:#3e2a32;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout{background:none;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:#9e8d92;cursor:pointer;transition:color 0.18s;padding:0}
.signout:hover{color:#b06080}
/* MAIN */
.main{max-width:680px;margin:0 auto;padding:36px 20px 100px}
.page-eyebrow{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#b06080;margin-bottom:8px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#2c1b22;letter-spacing:-0.02em;line-height:1.1;margin-bottom:8px}
.page-sub{font-size:14px;color:#9e8d92;line-height:1.65;margin-bottom:12px;font-weight:300}
.page-error{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:20px}
.page-error.show{display:block}
/* ADMIN STATS */
.admin-stats{display:none;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid rgba(176,96,128,0.08);border-radius:16px;padding:16px;text-align:center}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:#b06080;line-height:1}
.stat-l{font-family:'Inter',sans-serif;font-size:11px;color:#9e8d92;margin-top:4px}
/* ADD BTN */
.add-btn{display:inline-flex;align-items:center;gap:8px;background:#b06080;color:#fff;border:none;border-radius:999px;padding:13px 24px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.2s,transform 0.18s;box-shadow:0 4px 20px rgba(176,96,128,0.30);margin-bottom:28px}
.add-btn:hover{background:#c47a94}
.add-btn:active{transform:scale(0.97)}
/* CARDS */
.card{background:#fff;border:1px solid rgba(176,96,128,0.08);border-radius:20px;overflow:hidden;display:flex;margin-bottom:12px;box-shadow:0 2px 14px rgba(44,27,34,0.06);transition:box-shadow 0.22s,background 0.4s}
.card:hover{box-shadow:0 6px 28px rgba(44,27,34,0.10)}
.card-thumb{width:76px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.card-body{flex:1;padding:16px 18px 14px 0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:10px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#2c1b22;line-height:1.2}
.card-meta{font-size:11.5px;color:#9e8d92;margin-top:2px}
.card-price{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:#b06080;white-space:nowrap;flex-shrink:0}
.card-status{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;margin-bottom:6px}
.card-by{font-size:11px;color:#c0b4b8;font-family:'Inter',sans-serif;margin-bottom:6px}
.card-desc{font-size:12.5px;color:#9e8d92;line-height:1.6;margin-bottom:10px;font-weight:300;padding-right:8px}
.card-actions{display:flex;gap:7px;flex-wrap:wrap}
.btn-approve{background:rgba(74,222,128,0.12);color:#16803c;border:1px solid rgba(74,222,128,0.30);border-radius:999px;padding:5px 14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s}
.btn-approve:hover{background:rgba(74,222,128,0.22)}
.btn-reject{background:rgba(248,113,113,0.10);color:#dc2626;border:1px solid rgba(248,113,113,0.25);border-radius:999px;padding:5px 14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s}
.btn-reject:hover{background:rgba(248,113,113,0.20)}
.btn-edit{background:rgba(176,96,128,0.08);color:#b06080;border:1px solid rgba(176,96,128,0.20);border-radius:999px;padding:5px 14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s}
.btn-edit:hover{background:rgba(176,96,128,0.16)}
.btn-del{background:rgba(255,255,255,0);color:#c0b4b8;border:1px solid rgba(200,188,192,0.30);border-radius:999px;padding:5px 14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:400;cursor:pointer;transition:all 0.18s}
.btn-del:hover{color:#dc2626;border-color:rgba(220,38,38,0.25)}
/* EMPTY */
.empty{background:#fff;border-radius:20px;border:1px solid rgba(176,96,128,0.08);padding:56px 24px;text-align:center}
.empty-icon{font-size:40px;margin-bottom:14px;opacity:0.5}
.empty p{font-family:'Inter',sans-serif;font-size:14px;color:#9e8d92;line-height:1.7}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,9,13,0.48);backdrop-filter:blur(8px);z-index:300;align-items:flex-end;justify-content:center;padding:0}
.modal-overlay.show{display:flex;animation:overlay-in 0.22s ease}
@keyframes overlay-in{from{opacity:0}to{opacity:1}}
.modal{background:#f0ebe2;border-radius:28px 28px 0 0;padding:8px 22px 48px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;animation:modal-in 0.32s cubic-bezier(0.22,1,0.36,1)}
@keyframes modal-in{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:640px){.modal{border-radius:28px;margin:auto;margin-bottom:40px;max-height:88vh}}
.modal-handle{width:36px;height:3px;background:#ddd7cc;border-radius:2px;margin:14px auto 22px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#2c1b22;margin-bottom:20px;letter-spacing:-0.01em}
.form-err{font-family:'Inter',sans-serif;font-size:13px;color:#dc2626;min-height:16px;opacity:0;transition:opacity 0.3s;margin-bottom:12px}
.form{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-label{display:block;font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#9e8d92;margin-bottom:6px}
.field-input,.field-select,.field-textarea{width:100%;background:#fff;border:1px solid rgba(176,96,128,0.12);border-radius:12px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14.5px;color:#2c1b22;outline:none;transition:all 0.18s;appearance:none}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:rgba(176,96,128,0.40);box-shadow:0 0 0 3px rgba(176,96,128,0.08)}
.field-input::placeholder{color:#c0b4b8}
.field-textarea{resize:vertical;min-height:80px}
.image-preview-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.image-preview{display:none;width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid rgba(176,96,128,0.18);background:#f7efe9}
.image-hint{font-size:12px;color:#9e8d92;line-height:1.5}
.modal-footer{display:flex;gap:10px;margin-top:6px}
.submit-btn{flex:1;background:#b06080;color:#fff;border:none;border-radius:999px;padding:15px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s}
.submit-btn:hover{background:#c47a94}
.submit-btn:disabled{opacity:0.6;cursor:default}
.cancel-btn{background:#fff;color:#9e8d92;border:1px solid #ddd7cc;border-radius:999px;padding:15px 22px;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all 0.2s}
.cancel-btn:hover{background:#f0ebe2}

      <div class="row">
        <div>
          <label class="field-label">Area / Locality *</label>
          <input class="field-input" id="f-area" placeholder="e.g. Mansarovar"/>
        </div>
        <div>
          <label class="field-label">Price *</label>
          <input class="field-input" id="f-price" placeholder="e.g. ₹68 Lakh"/>
        </div>
      </div>
      <div>
        <label class="field-label">Size</label>
        <input class="field-input" id="f-size" placeholder="e.g. 200 sq yd or 1100 sq ft"/>
      </div>
      <div>
        <label class="field-label">Description</label>
        <textarea class="field-textarea" id="f-desc" placeholder="Key highlights — road access, floor, facing, nearby landmarks…"></textarea>
      </div>
      <div>
        <label class="field-label">Property image</label>
        <input class="field-input" id="f-image" type="file" accept="image/*" onchange="handleListingImage(event)" />
        <div class="image-preview-row">
          <img id="image-preview" class="image-preview" alt="Selected property preview" />
          <div class="image-hint">Optional. JPG or PNG files will be stored in Supabase Storage and shown on the homepage.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="submit-btn" id="submit-btn" onclick="submitListing()">Submit for approval</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
