<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Property Details — PinkCity</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const supabaseUrl = "https://mfpnndrszjygespcfdbo.supabase.co";
const supabaseKey = "sb_publishable_BN03ClNsFtgDS32FbAFckQ_vSGfFccf";
const sbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

const GRADS = {
  plot: "linear-gradient(135deg,#c8a98a,#9a7050)",
  farmhouse: "linear-gradient(135deg,#5a8a6a,#2a5a3a)",
  apartment: "linear-gradient(135deg,#8090b0,#506080)",
  villa: "linear-gradient(135deg,#c4a870,#8a6a40)",
  land: "linear-gradient(135deg,#8aaa7a,#4a7a4a)",
  commercial: "linear-gradient(135deg,#6a8faf,#3a5f7f)"
};
const EMOJI = {plot:"🏜️",farmhouse:"🌿",apartment:"🏢",villa:"🏯",land:"🌾",commercial:"🏗️"};
const TYPE_LABEL = {plot:"Residential Plot",farmhouse:"Farmhouse",apartment:"Apartment",villa:"Luxury Villa",land:"Investment Land",commercial:"Commercial Plot"};

async function loadListing() {
  const id = new URLSearchParams(window.location.search).get("id");
  if (!id) { showError("No listing ID provided."); return; }

  const { data, error } = await sbClient.from("listings").select("*").eq("id", id).eq("status", "active").maybeSingle();
  if (error || !data) { showError("Listing not found or not yet approved."); return; }

  const l = data;
  document.title = l.title + " — PinkCity";

  // Hero image or gradient
  const hero = document.getElementById("hero");
  if (l.image_url) {
    hero.style.backgroundImage = `url(${l.image_url})`;
    hero.style.backgroundSize = "cover";
    hero.style.backgroundPosition = "center";
  } else {
    hero.style.background = GRADS[l.type] || GRADS.plot;
    hero.style.display = "flex";
    hero.style.alignItems = "center";
    hero.style.justifyContent = "center";
    hero.innerHTML = `<span style="font-size:80px">${EMOJI[l.type]||"🏠"}</span>`;
  }

  // Badges
  document.getElementById("type-badge").textContent = TYPE_LABEL[l.type] || l.type;
  if (l.verified) document.getElementById("verified-badge").style.display = "inline-flex";

  // Details
  document.getElementById("listing-title").textContent = l.title;
  document.getElementById("listing-price").textContent = l.price;
  document.getElementById("listing-area").textContent = l.area + ", Jaipur";
  document.getElementById("listing-size").textContent = l.size || "—";
  document.getElementById("listing-desc").textContent = l.desc || l.description || "Contact us for full property details.";
  document.getElementById("wa-btn").href = `https://wa.me/919358830405?text=${encodeURIComponent("Hi, I'm interested in: " + l.title + " (" + l.price + ") in " + l.area)}`;

  document.getElementById("skeleton").style.display = "none";
  document.getElementById("content").style.display = "block";
}

function showError(msg) {
  document.getElementById("skeleton").innerHTML = `<div style="text-align:center;padding:80px 24px;font-family:Inter,sans-serif;color:#9e8d92;">${msg}<br><br><a href="index.html" style="color:#b06080;">← Back to listings</a></div>`;
}

loadListing();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0ebe2;min-height:100vh;-webkit-font-smoothing:antialiased}
.topnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(248,244,238,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(176,96,128,0.10)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand-icon{width:36px;height:36px;border-radius:50%;background:#b06080;overflow:hidden;padding:4px;display:flex;align-items:center;justify-content:center}
.brand-icon img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#2c1b22}
.brand-name em{color:#b06080;font-style:normal}
.back-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:#9e8d92;text-decoration:none;display:flex;align-items:center;gap:5px}
.back-btn:hover{color:#b06080}
#hero{width:100%;height:280px;position:relative;overflow:hidden;background:#ddd7cc}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,9,13,0.55) 0%,transparent 60%)}
.hero-badges{position:absolute;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-radius:999px;padding:5px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:#2c1b22}
.badge-verified{background:#1e1016;color:white;display:none}
.badge-verified::before{content:'✓ ';color:#4ade80}
.main{max-width:640px;margin:0 auto;padding:0 20px 80px}
.price-row{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 0 16px;border-bottom:1px solid rgba(176,96,128,0.10)}
.price{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;color:#b06080;letter-spacing:-0.02em;line-height:1}
.price-sub{font-family:'Inter',sans-serif;font-size:12px;color:#9e8d92;margin-top:4px}
.title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:#2c1b22;margin-top:20px;letter-spacing:-0.01em;line-height:1.15}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.meta-card{background:#fff;border-radius:14px;border:1px solid rgba(176,96,128,0.08);padding:14px 16px}
.meta-label{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9e8d92;margin-bottom:5px}
.meta-value{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#2c1b22}
.desc-title{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#9e8d92;margin-bottom:10px}
.desc-text{font-family:'Inter',sans-serif;font-size:15px;font-weight:300;line-height:1.78;color:#3e2a32}
.cta-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(248,244,238,0.97);backdrop-filter:blur(12px);border-top:1px solid rgba(176,96,128,0.12);padding:14px 20px;display:flex;gap:10px;max-width:640px;margin:0 auto}
.btn-wa{flex:1;background:#25d366;color:#fff;border:none;border-radius:999px;padding:15px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 16px rgba(37,211,102,0.30)}
.btn-consult{flex:1;background:#b06080;color:#fff;border:none;border-radius:999px;padding:15px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 16px rgba(176,96,128,0.28)}
.skeleton{padding:24px}
.skel{background:linear-gradient(90deg,#e8e2d8 25%,#f0ebe2 50%,#e8e2d8 75%);background-size:200% 100%;animation:skel 1.4s ease-in-out infinite;border-radius:10px;margin-bottom:12px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
#content{display:none}
@media(min-width:640px){#hero{height:380px}.price{font-size:44px}}
</style>
</head>
